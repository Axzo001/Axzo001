  <g font-family="'Fira Code', 'Segoe UI', monospace" font-size="12.5">
    <text x="260" y="85" fill="#00F2FE" font-weight="bold">axz01</text>
    <text x="302" y="85" fill="#8B949E">@</text>
    <text x="312" y="85" fill="#00F2FE" font-weight="bold">Axz01</text>
    <text x="260" y="100" fill="#30363D">------------------------------------------</text>

    <text x="260" y="125" fill="#58A6FF" font-weight="bold">OS</text>
    <text x="330" y="125" fill="#8B949E">›</text>
    <text x="350" y="125" fill="#C9D1D9">Arch Linux x86_64</text>

    <text x="260" y="150" fill="#58A6FF" font-weight="bold">Host</text>
    <text x="330" y="150" fill="#8B949E">›</text>
    <text x="350" y="150" fill="#C9D1D9">ASUS Vivobook 16 (RTX 4050 + Core 5)</text>

    <text x="260" y="175" fill="#58A6FF" font-weight="bold">DE / WM</text>
    <text x="330" y="175" fill="#8B949E">›</text>
    <text x="350" y="175" fill="#C9D1D9">GNOME 50.4 (Console 50.0)</text>

    <text x="260" y="200" fill="#58A6FF" font-weight="bold">Shell</text>
    <text x="330" y="200" fill="#8B949E">›</text>
    <text x="350" y="200" fill="#C9D1D9">zsh 5.9.2 + Starship</text>

    <text x="260" y="225" fill="#58A6FF" font-weight="bold">Editor</text>
    <text x="330" y="225" fill="#8B949E">›</text>
    <text x="350" y="225" fill="#00F2FE" font-weight="bold">Zed</text>

    <text x="260" y="250" fill="#58A6FF" font-weight="bold">Hobbies</text>
    <text x="330" y="250" fill="#8B949E">›</text>
    <text x="350" y="250" fill="#C9D1D9">Speedcubing (CFOP Sub-15), C++, CLI Tools</text>

    <text x="260" y="275" fill="#58A6FF" font-weight="bold">Status</text>
    <text x="330" y="275" fill="#8B949E">›</text>
    <text x="350" y="275" fill="#7EE787">Building hardware &amp; software projects</text>

    <!-- Color Palette -->
    <rect x="260" y="300" width="16" height="12" fill="#484F58" rx="2"/>
    <rect x="282" y="300" width="16" height="12" fill="#FF7B72" rx="2"/>
    <rect x="304" y="300" width="16" height="12" fill="#7EE787" rx="2"/>
    <rect x="326" y="300" width="16" height="12" fill="#F2CC60" rx="2"/>
    <rect x="348" y="300" width="16" height="12" fill="#58A6FF" rx="2"/>
    <rect x="370" y="300" width="16" height="12" fill="#BC8CFF" rx="2"/>
    <rect x="392" y="300" width="16" height="12" fill="#00F2FE" rx="2"/>
    <rect x="414" y="300" width="16" height="12" fill="#F0F6FC" rx="2"/>
