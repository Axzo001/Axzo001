<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1793D1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#1793D1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F2FE" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main Window Frame -->
  <rect x="2" y="2" width="796" height="346" rx="12" fill="#0D1117" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Title Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 786 2 Q 798 2 798 14 L 798 38 L 2 38 Z" fill="#161B22" />
  <line x1="2" y1="38" x2="798" y2="38" stroke="#30363D" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="22" cy="20" r="6" fill="#FF5F56" />
  <circle cx="42" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="62" cy="20" r="6" fill="#27C93F" />

  <!-- Editor Tab -->
  <rect x="85" y="8" width="160" height="24" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="165" y="24" fill="#00F2FE" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="middle">zed › profile.cpp</text>
  
  <text x="500" y="24" fill="#8B949E" font-family="'Fira Code', 'Courier New', monospace" font-size="11" text-anchor="middle">axz01@Axz01: ~</text>

  <!-- Arch Linux Vector Emblem (Left) -->
  <g transform="translate(35, 75) scale(6.8)" fill="url(#archGrad)" filter="url(#glow)">
    <path d="M11.39.605C10.376 3.092 9.764 4.72 8.635 7.132c.693.734 1.543 1.589 2.923 2.554-1.484-.61-2.496-1.224-3.252-1.86C6.86 10.842 4.596 15.138 0 23.395c3.612-2.085 6.412-3.37 9.021-3.862a6.61 6.61 0 01-.171-1.547l.003-.115c.058-2.315 1.261-4.095 2.687-3.973 1.426.12 2.534 2.096 2.478 4.409a6.52 6.52 0 01-.212 1.62c2.617.484 5.426 1.768 9.049 3.864-4.594-8.257-6.86-12.553-8.307-15.568-.755.636-1.767 1.25-3.252 1.86 1.38-.965 2.23-1.82 2.924-2.554C13.084 4.72 12.472 3.092 11.458.605h-.068z"/>
  </g>
  <text x="117" y="270" fill="#00F2FE" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="bold" text-anchor="middle">ARCH LINUX</text>

  <!-- Divider -->
  <line x1="220" y1="55" x2="220" y2="320" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- System Info (Right) -->
  <g font-family="'Fira Code', 'Segoe UI', monospace" font-size="12.5">
    <text x="250" y="80" fill="#00F2FE" font-weight="bold">axz01</text>
    <text x="292" y="80" fill="#8B949E">@</text>
    <text x="302" y="80" fill="#00F2FE" font-weight="bold">Axz01</text>
    <text x="250" y="96" fill="#30363D">------------------------------------------</text>

    <text x="250" y="120" fill="#58A6FF" font-weight="bold">OS</text>
    <text x="320" y="120" fill="#8B949E">›</text>
    <text x="340" y="120" fill="#C9D1D9">Arch Linux x86_64</text>

    <text x="250" y="145" fill="#58A6FF" font-weight="bold">Host</text>
    <text x="320" y="145" fill="#8B949E">›</text>
    <text x="340" y="145" fill="#C9D1D9">ASUS Vivobook 16 (RTX 4050 + Core 5)</text>

    <text x="250" y="170" fill="#58A6FF" font-weight="bold">DE / WM</text>
    <text x="320" y="170" fill="#8B949E">›</text>
    <text x="340" y="170" fill="#C9D1D9">GNOME 50.4 (Console 50.0)</text>

    <text x="250" y="195" fill="#58A6FF" font-weight="bold">Shell</text>
    <text x="320" y="195" fill="#8B949E">›</text>
    <text x="340" y="195" fill="#C9D1D9">zsh 5.9.2 + Starship</text>

    <text x="250" y="220" fill="#58A6FF" font-weight="bold">Editor</text>
    <text x="320" y="220" fill="#8B949E">›</text>
    <text x="340" y="220" fill="#00F2FE" font-weight="bold">Zed</text>

    <text x="250" y="245" fill="#58A6FF" font-weight="bold">Hobbies</text>
    <text x="320" y="245" fill="#8B949E">›</text>
    <text x="340" y="245" fill="#C9D1D9">Speedcubing (CFOP Sub-15), C++, CLI Tools</text>

    <text x="250" y="270" fill="#58A6FF" font-weight="bold">Status</text>
    <text x="320" y="270" fill="#8B949E">›</text>
    <text x="340" y="270" fill="#7EE787">Building hardware &amp; software projects</text>

    <!-- Color Palette -->
    <rect x="250" y="295" width="16" height="12" fill="#484F58" rx="2"/>
    <rect x="272" y="295" width="16" height="12" fill="#FF7B72" rx="2"/>
    <rect x="294" y="295" width="16" height="12" fill="#7EE787" rx="2"/>
    <rect x="316" y="295" width="16" height="12" fill="#F2CC60" rx="2"/>
    <rect x="338" y="295" width="16" height="12" fill="#58A6FF" rx="2"/>
    <rect x="360" y="295" width="16" height="12" fill="#BC8CFF" rx="2"/>
    <rect x="382" y="295" width="16" height="12" fill="#00F2FE" rx="2"/>
    <rect x="404" y="295" width="16" height="12" fill="#F0F6FC" rx="2"/>
  </g>
</svg>
